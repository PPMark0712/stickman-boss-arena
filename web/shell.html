<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09101a">
  <meta name="description" content="一柄剑，两场决斗。用跳跃、劈斩与法术挑战双阶段 Boss。">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #09101a; overflow: hidden; }
    body { color: #e4edf0; font: 16px/1.6 system-ui, sans-serif; }
    #canvas { display: block; border: 0; outline: none; touch-action: none; }
    #status { position: fixed; inset: 0; display: grid; place-content: center; padding: 32px; background: #09101a; }
    #status[hidden] { display: none; }
    .eyebrow { color: #78e6bd; font-size: 12px; letter-spacing: 3px; }
    h1 { margin: 16px 0 24px; font-size: clamp(26px, 5vw, 42px); font-weight: 550; }
    progress { width: min(440px, 80vw); height: 6px; border: 0; accent-color: #78e6bd; }
    progress::-webkit-progress-bar { background: #23323b; }
    progress::-webkit-progress-value { background: #78e6bd; }
    #notice { max-width: 540px; white-space: pre-line; color: #a4b3c0; }
    button { padding: 10px 22px; width: fit-content; color: #e4edf0; background: #14232b; border: 1px solid #78e6bd; font: inherit; cursor: pointer; }
    noscript { position: fixed; inset: 0; padding: 64px; background: #09101a; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="火柴人 Boss 竞技场。方向键移动，Z 跳跃，X 挥剑，A 法术或长按回血，Esc 暂停。">
    浏览器不支持 Canvas，请使用新版 Chrome、Edge、Firefox 或 Safari。
  </canvas>
  <div id="status" role="status" aria-live="polite">
    <div class="eyebrow">STICKMAN / BOSS ARENA</div>
    <h1>一柄剑。两场决斗。</h1>
    <progress id="progress" aria-label="游戏加载进度"></progress>
    <p id="notice">正在加载竞技场…首次加载需要下载游戏资源。</p>
    <button id="retry" type="button" hidden>重新加载</button>
  </div>
  <noscript>请启用 JavaScript 后重新加载游戏。</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    const statusPanel = document.getElementById('status');
    const progress = document.getElementById('progress');
    const notice = document.getElementById('notice');
    const retry = document.getElementById('retry');
    const canvas = document.getElementById('canvas');
    retry.addEventListener('click', () => location.reload());
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('keydown', event => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
    });
    function fail(error) {
      console.error(error);
      statusPanel.hidden = false;
      progress.hidden = true;
      notice.textContent = '游戏启动失败，请检查网络并使用支持 WebGL 2 的桌面浏览器。\n' + (error.message || String(error));
      retry.hidden = false;
    }
    try {
      const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
      if (missing.length) throw new Error(missing.join(', '));
      const engine = new Engine($GODOT_CONFIG);
      engine.startGame({
        canvas,
        onProgress(current, total) {
          if (total > 0) {
            progress.max = total;
            progress.value = current;
            notice.textContent = '正在加载竞技场… ' + Math.round(current / total * 100) + '%';
          } else {
            progress.removeAttribute('value');
          }
        },
        onExit() {
          statusPanel.hidden = false;
          progress.hidden = true;
          notice.textContent = '游戏已退出，可重新加载。';
          retry.hidden = false;
        }
      }).then(() => {
        statusPanel.hidden = true;
        canvas.focus();
      }).catch(fail);
    } catch (error) {
      fail(error);
    }
  </script>
</body>
</html>
